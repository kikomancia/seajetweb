<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .coming-soon {
            height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("sj_components/images/imgHme/hme_bg_image_01.webp") no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .box {
            animation: fadeUp 1.2s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

        <!-- Fonts / CSS -->
    <link rel="stylesheet" href="sj_components/style.css">

</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div>
            <img src="sj_components/images/general/gen_loading.svg" width="120" alt="Loading...">
        </div>
    </div>

    <div class="coming-soon">
        <div class="box">
            <div class="mt-5">
                <img src="sj_components/images/general/gen_off_seajetlogo.webp" alt="" srcset="" height="100">
            </div>
            <div style="margin-top: 15px;">
                <h1>COMING SOON</h1>
                <p>We’re working on something amazing</p>


            </div>

        </div>
    </div>

    <!-- local script -->
    <script src="sj_components/javsript.js"></script>


</body>

</html>
